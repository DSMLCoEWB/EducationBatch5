worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # =========================================================================
    # SECURITY HARDENING
    # =========================================================================

    # Hide Nginx version from error pages and headers (information disclosure)
    server_tokens off;

    # --- Rate Limiting Zones ---
    # Protects against brute-force attacks on auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;
    # General API rate limit
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=6000r/m;

    # --- Request Size Limits ---
    # Block request body > 10MB to prevent memory exhaustion / file upload abuse
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # =========================================================================
    # PERFORMANCE
    # =========================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # =========================================================================
    # UPSTREAMS
    # =========================================================================
    upstream backend_cluster {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_cluster {
        server frontend:80;
        keepalive 16;
    }

    # =========================================================================
    # SERVER
    # =========================================================================
    server {
        listen 8000;
        server_name _;

        # --- OWASP Security Headers ---
        # Prevent clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # Enable browser XSS filter (legacy browsers)
        add_header X-XSS-Protection "1; mode=block" always;
        # Control referrer information sent with requests
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Restrict browser feature access (microphone, camera, geolocation etc.)
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Content Security Policy: Restrict resource origins
        # 'unsafe-inline' required for React inline styles; tighten further in future
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: fastly.jsdelivr.net; connect-src 'self'; frame-ancestors 'none';" always;
        # HSTS: Force HTTPS for 1 year (enable only when TLS is terminating here)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location ~ ^/api/(auth|login) {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # --- Allow direct /auth callbacks from OAuth providers ---
        location /auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # --- Backend API with SSE Streaming Support ---
        location /api/ {
            limit_req zone=api_limit burst=500 nodelay;
            limit_req_status 429;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE (Server-Sent Events) support — required for real-time notifications
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            # Long timeout for persistent SSE connections
            proxy_read_timeout 86400s;
        }

        # --- Frontend React SPA ---
        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- Block common attack paths ---
        location ~ /\. {
            deny all;
            return 404;
        }
        location ~* \.(env|git|svn|htaccess|htpasswd|log|bak|sql|enc|db|sqlite3)$ {
            deny all;
            return 404;
        }
    }
}
