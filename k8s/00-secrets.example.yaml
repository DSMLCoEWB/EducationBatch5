apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: grievance-system
type: Opaque
stringData:
  GMAIL_CREDENTIALS_JSON: "{}"
  # --- Google / Gemini AI Keys ---
  GOOGLE_API_KEY: "your_google_api_key_here"
  GEMINI_API_KEY: "your_gemini_api_key_here"
  PRIORITY_GOOGLE_API_KEY: "your_priority_google_api_key_here"
  PRIORITY_GEMINI_API_KEY: "your_priority_gemini_api_key_here"
  CHATBOT_GEMINI_API_KEY: "your_chatbot_gemini_api_key_here"
  # --- Google OAuth ---
  GOOGLE_OAUTH_CLIENT_ID: "your_oauth_client_id_here"
  GOOGLE_OAUTH_CLIENT_SECRET: "your_oauth_client_secret_here"
  # --- Microsoft OAuth ---
  MICROSOFT_OAUTH_CLIENT_ID: "your_microsoft_client_id_here"
  MICROSOFT_OAUTH_CLIENT_SECRET: "your_microsoft_client_secret_here"
  # --- Session & Encryption Secrets ---
  # Generate with: openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME"
  APP_SESSION_SECRET: "CHANGE_ME"
  # CRITICAL: Must be a valid Fernet key. Generate with:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  OAUTH_ENCRYPTION_KEY: "CHANGE_ME"
  # --- Database ---
  DB_USER: "postgres"
  DB_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@pgbouncer:5432/grievance"
