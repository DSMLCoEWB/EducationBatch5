# ---------------------------------------------
# POD DISRUPTION BUDGETS (PDB)
# ---------------------------------------------
# Ensures high availability during voluntary node disruptions (e.g., K8s upgrades, maintenance)
# By guaranteeing a minimum number of healthy pods are always running.

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: grievance-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: grievance-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: celery-worker-pdb
  namespace: grievance-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: celery-worker
