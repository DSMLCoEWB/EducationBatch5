# =============================================================================
# PostgreSQL Server Configuration (postgresql.conf)
# Hardened for maximum security on a government grievance management system.
# =============================================================================

# --- AUTHENTICATION ---
# Force SCRAM-SHA-256 as the ONLY password hashing algorithm.
# This affects all new passwords set after this configuration is applied.
# MD5 is cryptographically broken and explicitly disabled.
password_encryption = scram-sha-256

# --- CONNECTION SETTINGS ---
# Listen on all interfaces (PgBouncer is the only allowed ingress point)
listen_addresses = '*'
max_connections = 100

# --- LOGGING (Security Audit Trail) ---
# Log all connection attempts for forensic analysis
log_connections = on
log_disconnections = on
# Log all failed authentication attempts
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
# Log queries that take longer than 1 second (detect anomalous behavior)
log_min_duration_statement = 1000
# Log all DDL statements (CREATE, ALTER, DROP) - critical for tamper detection
log_statement = 'ddl'

# --- QUERY TIMEOUT (Defense against runaway queries / DoS) ---
# Kill any query that runs longer than 5 minutes
statement_timeout = 300000

# --- SSL (Uncomment for production deployments with TLS termination at DB level) ---
# ssl = on
# ssl_cert_file = 'server.crt'
# ssl_key_file = 'server.key'
# ssl_min_protocol_version = 'TLSv1.2'

# --- PERFORMANCE (Tuned for a 2Gi memory limit) ---
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 64MB

# --- WAL (Write-Ahead Logging for durability) ---
wal_level = replica
# Ensure every transaction is flushed to disk before confirming (no data loss)
synchronous_commit = on
