# =============================================================================
# PostgreSQL Client Authentication Configuration (pg_hba.conf)
# =============================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# SECURITY POLICY: scram-sha-256 is the strongest password hashing algorithm
# supported by PostgreSQL. It uses a salted challenge-response protocol that
# prevents password interception even on untrusted networks.
# MD5 authentication is explicitly PROHIBITED.
# =============================================================================

# "local" connections via Unix domain socket (used by pg_isready health checks)
local   all             all                                     scram-sha-256

# IPv4 connections from within the Docker/K8s cluster network
host    all             all             0.0.0.0/0               scram-sha-256

# IPv6 connections
host    all             all             ::1/128                 scram-sha-256

# Replication connections (disabled by default for single-node deployment)
# host  replication     all             0.0.0.0/0               scram-sha-256
