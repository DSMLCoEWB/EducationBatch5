services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grievance-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/files:/app/files
      - ./backend/policies:/app/policies
      - ./backend/demo_policies:/app/demo_policies
      - ./backend/attachments:/app/attachments
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_REPLY_API_URL: ${VITE_REPLY_API_URL:-http://localhost:8000}
    container_name: grievance-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
