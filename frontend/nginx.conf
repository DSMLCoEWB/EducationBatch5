server {
    listen 80 default_server;
    server_name _;

    # Hide Nginx version
    server_tokens off;

    # Base directory for Vite production build
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # SECURITY HEADERS
    # (Duplicated here for defense-in-depth when frontend is accessed directly)
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;

    # =========================================================================
    # PERFORMANCE
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # =========================================================================
    # CACHING
    # =========================================================================
    # Cache hashed Vite assets forever (filenames change on content change)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Security headers still required on asset responses
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never cache index.html (ensures users always get latest app shell)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # =========================================================================
    # SPA ROUTING
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # DENY HIDDEN FILES & SENSITIVE PATHS
    # =========================================================================
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(env|git|svn|htaccess|htpasswd|log|bak|sql|enc|db|sqlite3)$ {
        deny all;
        return 404;
    }
}
